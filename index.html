<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM COMPROMISED - TRACKING ACTIVE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .terminal {
            width: 650px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
            color: #00ff41;
            z-index: 10;
        }

        .header {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            color: #ff0000;
            animation: blink 0.8s infinite;
        }

        .log {
            font-size: 13px;
            line-height: 1.6;
            height: 300px;
            overflow-y: hidden;
        }

        .visitor-info-box {
            margin-top: 10px;
            padding: 10px;
            border: 1px dashed #ffff00;
            color: #ffff00;
            display: none; /* Hiện lên sau khi thu thập xong */
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        .glitch {
            animation: shake 0.3s infinite;
            animation-play-state: paused;
        }

        body:active .glitch {
            animation-play-state: running;
        }

        @keyframes shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body class="glitch">

    <canvas id="matrixCanvas"></canvas>

    <div class="overlay">
        <div class="terminal">
            <div class="header">⚠️ CRITICAL SYSTEM BREACH DETECTED ⚠️</div>
            <div class="log" id="log">
                <p>> Initializing hacking protocols...</p>
            </div>
            <div id="visitorBox" class="visitor-info-box">
                <strong>[TARGET IDENTIFIED]</strong><br>
                <span id="ipAddr">IP: Fetching...</span><br>
                <span id="browserInfo">Browser: Fetching...</span><br>
                <span id="locInfo">System: Fetching...</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. HIỆU ỨNG MA TRẬN ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$@#%&*^";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // --- 2. HÀM THU THẬP THÔNG TIN NGƯỜI DÙNG ---
        async function captureVisitor() {
            const log = document.getElementById('log');
            const addMsg = (text, delay) => {
                return new Promise(res => setTimeout(() => {
                    const p = document.createElement('p');
                    p.innerHTML = `> ${text}`;
                    log.appendChild(p);
                    log.scrollTop = log.scrollHeight;
                    res();
                }, delay));
            };

            await addMsg("Bypassing user firewall...", 1000);
            await addMsg("Accessing network metadata...", 800);

            try {
                // Lấy IP thật qua API
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                
                // Hiển thị khung thông tin mục tiêu
                document.getElementById('visitorBox').style.display = 'block';
                document.getElementById('ipAddr').innerText = `IP: ${data.ip}`;
                document.getElementById('browserInfo').innerText = `Agent: ${navigator.userAgent.substring(0, 50)}...`;
                document.getElementById('locInfo').innerText = `Screen: ${window.screen.width}x${window.screen.height} | Lang: ${navigator.language}`;

                await addMsg("<span style='color:#ffff00'>[SUCCESS] Visitor data captured and encrypted.</span>", 500);
                await addMsg("Sending packets to remote server...", 1200);
                await addMsg("Clearing traces...", 1500);
                await addMsg("SYSTEM OWNED.", 500);

            } catch (e) {
                await addMsg("<span style='color:red'>[ERROR] Metadata capture failed. Offline mode active.</span>", 500);
            }
        }

        captureVisitor();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
