<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM CRITICAL ERROR</title>
    <style>
        /* Định dạng nền và font chữ */
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Canvas cho hiệu ứng Ma trận */
        canvas {
            display: block;
        }

        /* Lớp phủ nội dung Hacker */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            pointer-events: none; /* Cho phép tương tác xuyên qua lớp này */
        }

        .terminal {
            width: 600px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px #00ff41;
            color: #00ff41;
            z-index: 10;
        }

        .header {
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 20px;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            animation: blink 0.5s infinite;
        }

        .log {
            font-size: 14px;
            line-height: 1.5;
            height: 250px;
            overflow: hidden;
        }

        .danger-text {
            color: #ff0000;
            font-weight: bold;
        }

        /* Hiệu ứng chớp nháy */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Hiệu ứng rung màn hình khi bị hack */
        .glitch {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0,0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body class="glitch">

    <canvas id="matrixCanvas"></canvas>

    <div class="overlay">
        <div class="terminal">
            <div class="header">⚠️ WARNING: MALICIOUS INTRUSION DETECTED ⚠️</div>
            <div class="log" id="log">
                <!-- Nội dung log sẽ được chèn bằng JS -->
            </div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH HIỆU ỨNG MATRIX ---
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$@#%&*^";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        // --- HIỆU ỨNG LOG CHỮ CHẠY ---
        const logContainer = document.getElementById('log');
        const messages = [
            "> Initializing back-door...",
            "> Connection established with 192.168.1.104",
            "> Bypassing firewall protocols...",
            "> Searching for sensitive data...",
            "> [ERROR] Access denied. Retrying...",
            "> Exploit successful. Root access granted.",
            "> Downloading database: 12%... 48%... 89%...",
            "> <span class='danger-text'>ENCRYPTION KEYS COMPROMISED</span>",
            "> Remote IP: 45.122.10.XX",
            "> Uploading local files to secure server...",
            "> Deleting system logs to hide tracks...",
            "> SYSTEM BREACH COMPLETE."
        ];

        let msgIndex = 0;
        function addLog() {
            if (msgIndex < messages.length) {
                const p = document.createElement('p');
                p.innerHTML = messages[msgIndex];
                logContainer.appendChild(p);
                logContainer.scrollTop = logContainer.scrollHeight;
                msgIndex++;
                setTimeout(addLog, Math.random() * 2000 + 500);
            }
        }

        // Chạy cả hai hiệu ứng
        setInterval(drawMatrix, 35);
        addLog();

        // Xử lý khi resize màn hình
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
